services:
  - type: web
    name: pipefabar-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pipefabar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APPLE_BUNDLE_ID
        value: com.missionintegratedsystems.pipefab

databases:
  - name: pipefabar-db
    databaseName: pipefabar
    plan: free
